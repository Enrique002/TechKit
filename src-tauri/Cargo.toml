[package]
name = "techkit"
version = "1.0.0"
description = "TechKit Desktop Application for IT Technicians"
authors = ["TechKit Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
sysinfo = "0.33.1"
